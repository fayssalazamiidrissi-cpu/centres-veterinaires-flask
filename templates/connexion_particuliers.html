<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Particuliers</title>
</head>
<body>

<h1>Connexion - Particuliers</h1>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul style="color: red;">
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<form action="/connexion_particuliers" method="post">
    <label for="nom">Nom du Propriétaire :</label><br>
    <input type="text" id="nom" name="nom" required><br><br>

    <label for="animal_id">Numéro de Suivi de l'Animal :</label><br>
    <input type="number" id="animal_id" name="animal_id" required><br><br>

    <button type="submit">Se connecter</button>
</form>

<a href="/">Retour à l'accueil</a>

</body>
</html>
