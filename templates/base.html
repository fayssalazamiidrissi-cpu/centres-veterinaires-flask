<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mon Site{% endblock %}</title>
    <style>
        /* Classes CSS pour les messages flash */
        .success-message {
            color: green;
            font-weight: bold;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
        .info-message {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Afficher les messages flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div style="margin: 10px;">
                {% for category, message in messages %}
                    <p class="{% if category == 'success' %}success-message{% elif category == 'error' %}error-message{% else %}info-message{% endif %}">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    
    <!-- Contenu principal des pages -->
    {% block content %}{% endblock %}
</body>
</html>
